name: do_your_projects
description: "Odoo Project Management App - Do Your Projects"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # UI and Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.20.2
  hugeicons: ^0.0.11
  font_awesome_flutter: ^10.10.0
  flutter_svg: ^2.0.17
  lottie: ^3.3.0

  # Navigation & Routing
  # (go_router removed: app uses Navigator 1.0 via MaterialApp(home:))

  # State Management
  provider: ^6.1.5

  # HTTP and API
  http: ^1.3.0
  odoo_rpc: ^0.7.1

  # Local Storage & Preferences
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.2
  path: ^1.9.0
  xml: ^6.6.1
  flutter_cache_manager: ^3.4.1

  # Loading and Progress
  shimmer: ^3.0.0
  loading_animation_widget: ^1.3.0

  # Charts
  fl_chart: ^1.1.1

  # Utils and Plugins
  # (connectivity_plus, url_launcher removed: no usages in lib/)

  # Authentication
  local_auth: ^2.3.0

  # Other Widgets
  flutter_speed_dial: ^7.0.0
  percent_indicator: ^4.2.4
  timeago: ^3.7.0
  phosphor_flutter: ^2.1.0
  flutter_widget_from_html: ^0.17.2
  route_observer_mixin: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/
